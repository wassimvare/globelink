name: Phase 4 import fix

on:
  push:
    branches: [refactor-phase-4]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[phase4-import-fixed]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor-phase-4
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply import fix
        run: node scripts/fix-phase4-primary-import.mjs
      - name: Commit import fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/map.tsx
          git diff --cached --quiet && exit 0
          git commit -m "fix: import explorer primary categories [phase4-import-fixed]"
          git push origin HEAD:refactor-phase-4
