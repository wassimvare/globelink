name: Phase 6 journal codemod

on:
  push:
    branches: [stabilisation-phase-6]

permissions:
  contents: write

jobs:
  codemod:
    if: ${{ !contains(github.event.head_commit.message, '[phase6-generated]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stabilisation-phase-6
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply journal refactor
        run: node scripts/apply-phase6-journal.mjs
      - name: Commit generated refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/TripDaySectionPremium.tsx
          git diff --cached --quiet && exit 0
          git commit -m "feat: enforce phase 6 daily journal [phase6-generated]"
          git push origin HEAD:stabilisation-phase-6
