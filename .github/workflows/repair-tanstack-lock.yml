name: Repair TanStack lockfile (temporary)

on:
  push:
    branches:
      - fix/catalog-loading-csp-20261009
    paths:
      - .github/workflows/repair-tanstack-lock.yml

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Generate a consistent lockfile from the patched manifest
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Check patched versions
        run: |
          node --input-type=module -e "
            import fs from 'node:fs';
            const lock = JSON.parse(fs.readFileSync('package-lock.json','utf8'));
            const start = lock.packages['node_modules/@tanstack/react-start']?.version;
            const core = lock.packages['node_modules/@tanstack/start-server-core']?.version;
            if (start !== '1.168.60' || core !== '1.169.39') throw Error('Expected patched versions, got '+start+'/'+core);
            console.log('Patched dependencies verified:',start,core);
          "
      - name: Commit generated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "fix(security): regenerate TanStack patched npm lockfile"
            git push origin HEAD:fix/catalog-loading-csp-20261009
          fi
