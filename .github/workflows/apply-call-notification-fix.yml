name: Apply call notification fix

on:
  push:
    branches: [main]
    paths:
      - "scripts/fix-call-notification-delivery.mjs"
      - ".github/workflows/apply-call-notification-fix.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch CallProvider
        run: node scripts/fix-call-notification-delivery.mjs
      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "No patch needed"
            exit 0
          fi
          git config user.name "GlobeLink Fix Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/components/CallProvider.tsx
          git commit -m "fix: deliver one incoming call notification"
          git push
