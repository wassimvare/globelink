name: GlobeLink Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: globelink-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Validate Phase 2 critical surfaces
        run: npm run check:phase2

      - name: Validate Phase 3 authenticated journey contract
        run: npm run check:phase3

      - name: Validate Phase 4 architecture boundaries
        run: npm run check:phase4

      - name: Validate Phase 5 travel data reliability
        run: npm run check:phase5

      - name: Validate Phase 6 daily journal
        run: npm run check:phase6

      - name: Build GlobeLink
        run: npm run build

  e2e:
    name: Browser E2E
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install app dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Install Playwright test runner
        run: npm install --no-save --ignore-scripts --no-audit --no-fund @playwright/test@1.55.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run public and access-control journeys
        run: npx playwright test e2e/core.smoke.spec.ts e2e/critical-surfaces.spec.ts

      - name: Run live authenticated journeys when test accounts are configured
        env:
          E2E_USER_A_EMAIL: ${{ secrets.E2E_USER_A_EMAIL }}
          E2E_USER_A_PASSWORD: ${{ secrets.E2E_USER_A_PASSWORD }}
          E2E_USER_B_EMAIL: ${{ secrets.E2E_USER_B_EMAIL }}
          E2E_USER_B_PASSWORD: ${{ secrets.E2E_USER_B_PASSWORD }}
        run: npx playwright test e2e/authenticated-live.spec.ts

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7
