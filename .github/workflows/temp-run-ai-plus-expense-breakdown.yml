name: Run IA+ expense breakdown patch

on:
  push:
    paths:
      - .github/trigger-ai-plus-expense-breakdown.txt

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run stored patch
        shell: bash
        run: |
          awk '/python3 <<'"'"'PY'"'"'/{capture=1; next} /^          PY$/{capture=0} capture { sub(/^          /, ""); print }' .github/workflows/temp-ai-plus-expense-breakdown-fix.yml > /tmp/patch.py
          python3 /tmp/patch.py
          git diff --check
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "GlobeLink Fix Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/components/TripDaySectionPremium.tsx 'src/routes/_authenticated.trips.$id.tsx' src/lib/ai-pro.functions.ts
          git commit -m "fix(ai+): show forecast expense breakdown by category"
          git push
