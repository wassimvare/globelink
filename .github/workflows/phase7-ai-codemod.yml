name: Phase 7 AI codemod

on:
  push:
    branches: [stabilisation-phase-7]

permissions:
  contents: write

jobs:
  codemod:
    if: ${{ !contains(github.event.head_commit.message, '[phase7-generated]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stabilisation-phase-7
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply Phase 7 AI integration
        run: node scripts/apply-phase7-ai.mjs
      - name: Commit generated integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/ai-pro.functions.ts src/routes/ai-pro.tsx src/routes/ai-trip.tsx
          git diff --cached --quiet && exit 0
          git commit -m "feat: finalize free AI and IA+ actions [phase7-generated]"
          git push origin HEAD:stabilisation-phase-7
