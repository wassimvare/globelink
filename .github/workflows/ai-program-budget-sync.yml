name: Apply IA+ program budget sync

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ai-program-budget-sync-main
  cancel-in-progress: true

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[ai-sync-generated]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply focused codemod
        run: |
          python3 scripts/ai-program-budget-sync-codemod.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path("src/lib/ai-pro.functions.ts")
          source = path.read_text()
          source = source.replace("(selectionRows ?? []).flatMap((row) =>", "(selectionRows ?? []).flatMap((row: any) =>")
          path.write_text(source)
          PY

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Validate carnet program and budget
        run: npm run check:phase6

      - name: Validate IA+ actions
        run: npm run check:phase7

      - name: Typecheck
        run: npm run typecheck

      - name: Commit generated source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/TripDaySectionPremium.tsx src/lib/ai-pro.functions.ts package.json
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git commit -m "feat: synchronize IA+ day choices and budgets [ai-sync-generated]"
          git push
