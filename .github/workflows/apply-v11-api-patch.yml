name: Apply V11 API Patch

on:
  push:
    branches:
      - feat/v11-google-ticketmaster
    paths:
      - ".v11-api-payload/**"
      - ".github/workflows/apply-v11-api-patch.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message != 'feat: integrate Google Places and Ticketmaster on V11'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v11-google-ticketmaster
          fetch-depth: 0
      - name: Apply packaged API changes
        shell: bash
        run: |
          cat .v11-api-payload/chunk-* > /tmp/v11-api-patch.b64
          base64 -d /tmp/v11-api-patch.b64 > /tmp/v11-api-patch.tar.gz
          tar -xzf /tmp/v11-api-patch.tar.gz -C .
          rm -rf .v11-api-payload
          rm -f .github/workflows/apply-v11-api-patch.yml
          git config user.name "GlobeLink Bot"
          git config user.email "91457289+wassimvare@users.noreply.github.com"
          git add -A
          git commit -m "feat: integrate Google Places and Ticketmaster on V11"
          git push origin HEAD:feat/v11-google-ticketmaster
