name: Apply GlobeLink V11.0.13 payload

on:
  push:
    branches:
      - deploy/v11.0.13-google-ticketmaster
    paths:
      - .v11-ready

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore V11.0.13 runtime files
        shell: bash
        run: |
          set -euo pipefail
          cat .v11-payload/part* | base64 -d > /tmp/v11-runtime.tar.xz
          echo "1488e6b626f4b9263460c8a39835ab75d315bedf8691507ad19f30e9d9256242  /tmp/v11-runtime.tar.xz" | sha256sum -c -
          tar -xJf /tmp/v11-runtime.tar.xz -C .
          rm -f bun.lock bun.lockb
      - name: Install dependencies and refresh lockfile
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock-only
          npm ci
      - name: Validate production build
        shell: bash
        run: |
          set -euo pipefail
          npm run build
      - name: Commit restored version
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .v11-payload .v11-ready .github/workflows/apply-v11-payload.yml
          git config user.name "GlobeLink Restore Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "restore: GlobeLink V11.0.13 with Google Places and Ticketmaster"
          git push origin HEAD:deploy/v11.0.13-google-ticketmaster
