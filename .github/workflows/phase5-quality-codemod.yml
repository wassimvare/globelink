name: Phase 5 catalog quality codemod

on:
  push:
    branches: [stabilisation-phase-5]

permissions:
  contents: write

jobs:
  codemod:
    if: ${{ !contains(github.event.head_commit.message, '[phase5-generated]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stabilisation-phase-5
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply catalog quality gate
        run: node scripts/apply-phase5-quality.mjs
      - name: Commit generated refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/live-catalog.ts
          git diff --cached --quiet && exit 0
          git commit -m "feat: enforce phase 5 catalog quality gate [phase5-generated]"
          git push origin HEAD:stabilisation-phase-5
