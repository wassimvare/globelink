name: Phase 1 - Freeze historical patches into source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/phase1-freeze-source.yml'

permissions:
  contents: write

jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout stabilisation branch
        uses: actions/checkout@v4
        with:
          ref: stabilisation-phase-1
          fetch-depth: 0

      - name: Apply historical patches once
        run: |
          node scripts/apply-build-patches.mjs
          node scripts/apply-late-source-patches.mjs

      - name: Commit generated source to stabilisation branch
        run: |
          if git diff --quiet; then
            echo "No source changes generated."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: freeze historical patches into source [skip ci]"
          git push origin HEAD:stabilisation-phase-1
