name: Phase 1 - Freeze historical patches into source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/phase1-freeze-source.yml'

permissions:
  contents: write

jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout stabilisation branch
        uses: actions/checkout@v4
        with:
          ref: stabilisation-phase-1
          fetch-depth: 0

      - name: Apply every historical transform and report stale ones
        shell: bash
        run: |
          set +e
          failures=""
          scripts=(
            scripts/apply-v11-api-patch.mjs
            scripts/apply-free-public-catalog.mjs
            scripts/apply-destination-public-catalog.mjs
            scripts/apply-public-place-photo-fallback.mjs
            scripts/explorer-reliability-v1.mjs
            scripts/apply-recap-media-map-fix.mjs
            scripts/apply-recap-geocoder-v2.mjs
            scripts/apply-explorer-travel-map-v1.mjs
            scripts/fix-explorer-add-to-trip-mobile-v1.mjs
            scripts/add-to-trip-everywhere-v1.mjs
            scripts/ai-readable-response-v1.mjs
            scripts/fix-trip-journal-days-v2.mjs
            scripts/run-trip-daily-program-v3.mjs
            scripts/apply-travel-match-v3.mjs
            scripts/journey-continuity-v1.mjs
            scripts/simplify-home-v1.mjs
            scripts/apply-user-content-deletion.mjs
            scripts/apply-conversation-deletion.mjs
            scripts/performance-cleanup-v1.mjs
            scripts/simple-onboarding-v1.mjs
            scripts/apply-booking-hotel-policy.mjs
            scripts/apply-public-open-data.mjs
          )

          for script in "${scripts[@]}"; do
            echo "::group::$script"
            node "$script"
            code=$?
            echo "::endgroup::"
            if [ "$code" -ne 0 ]; then
              failures="$failures $script"
              echo "STALE_OR_BROKEN_PATCH: $script (exit $code)"
            fi
          done

          echo "Patch diagnostics complete. Failures:$failures"
          exit 0

      - name: Commit transformed source to stabilisation branch
        run: |
          if git diff --quiet; then
            echo "No source changes generated."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: freeze historical patches into source [skip ci]"
          git push origin HEAD:stabilisation-phase-1
