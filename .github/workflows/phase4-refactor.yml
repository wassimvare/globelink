name: Phase 4 refactor

on:
  push:
    branches: [refactor-phase-4]

permissions:
  contents: write

jobs:
  refactor:
    if: ${{ !contains(github.event.head_commit.message, '[phase4-generated]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor-phase-4
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply domain extraction
        run: node scripts/apply-phase4-refactor.mjs
      - name: Commit generated refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/map.tsx src/routes/_authenticated.trips.index.tsx
          git diff --cached --quiet && exit 0
          git commit -m "refactor: apply phase 4 domain extraction [phase4-generated]"
          git push origin HEAD:refactor-phase-4
