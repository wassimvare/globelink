name: One-shot home trip source fix

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-shot-fix-home-trip-source.yml"

permissions:
  contents: write

jobs:
  fix-home-trip-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Patch home next-trip source
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("src/routes/index.tsx")
          text = path.read_text()

          new_query = "\n".join([
              '  const { data: nextTrip } = useQuery({',
              '    // The home card must use the same persisted trips as the Carnet.',
              '    // The `trips` prefix also lets Carnet create/delete invalidations refresh it immediately.',
              '    queryKey: ["trips", user?.id, "home-next"],',
              '    enabled: !!user,',
              '    queryFn: async () => {',
              '      const today = new Date().toISOString().slice(0, 10);',
              '      const { data, error } = await supabase',
              '        .from("trips")',
              '        .select("id,title,country,city,starts_on,ends_on")',
              '        .eq("user_id", user!.id)',
              '        .is("finalized_at", null)',
              '        .gte("ends_on", today)',
              '        .order("starts_on", { ascending: true })',
              '        .limit(1)',
              '        .maybeSingle();',
              '      if (error) throw error;',
              '      return data ?? null;',
              '    },',
              '    staleTime: 5 * 60_000,',
              '  });',
          ])

          pattern = r'^  const \{ data: nextTravelIntent \} = useQuery\(\{.*?^  \}\);'
          text, count = re.subn(pattern, new_query, text, count=1, flags=re.MULTILINE | re.DOTALL)
          if count != 1:
              raise SystemExit(f"Expected one nextTravelIntent query, replaced {count}")

          text = text.replace("nextTravelIntent", "nextTrip")
          text = text.replace("nextTrip.destination_city", "nextTrip.city")
          text = text.replace("nextTrip.destination_country", "nextTrip.country")
          text = text.replace("new Date(nextTrip.starts_on)", "new Date(`${nextTrip.starts_on}T12:00:00`)")
          text = text.replace("new Date(nextTrip.ends_on)", "new Date(`${nextTrip.ends_on}T12:00:00`)")

          meta_pattern = r'\{nextTrip\.interests\?\.length\s*\?\s*` · \$\{nextTrip\.interests\.slice\(0, 3\)\.join\(" · "\)\}`\s*:\s*""\}'
          text, meta_count = re.subn(
              meta_pattern,
              '{nextTrip.title ? ` · ${nextTrip.title}` : ""}',
              text,
              count=1,
          )
          if meta_count != 1:
              raise SystemExit(f"Expected one travel-intent interests display, replaced {meta_count}")

          if 'from("travel_intents")' in text or "nextTravelIntent" in text:
              raise SystemExit("Old home travel-intent source still present after patch")

          path.write_text(text)
          PY

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Commit verified fix and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/one-shot-fix-home-trip-source.yml
          git config user.name "GlobeLink Fix Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/routes/index.tsx .github/workflows/one-shot-fix-home-trip-source.yml
          git commit -m "fix: source home next trip from carnet"
          git push origin HEAD:main
