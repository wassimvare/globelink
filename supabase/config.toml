[auth]
site_url = "http://localhost:5173"
additional_redirect_urls = [
  "http://127.0.0.1:5173/**",
  "http://localhost:5173/**",
  "https://*.trycloudflare.com/**"
]
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true

# In production, configure the Recovery email template with {{ .Token }} so
# password recovery uses a 6-digit code instead of an external magic link.

[auth.email.template.confirmation]
subject = "{{ .Token }} — ton code GlobeLink"
content_path = "./supabase/email-templates/confirm-signup.html"

[functions.sync-travel-catalog]
verify_jwt = false
